name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - README.md
      - .github/workflows/update-readme-cards.yml

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate GitHub stats light card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&show=prs_merged,prs_merged_percentage&theme=default
          path: profile/github-stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate WakaTime light card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: wakatime
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=20&theme=default
          path: profile/wakatime-stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
